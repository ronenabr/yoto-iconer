[project]
name = "yoto-iconer"
version = "0.1.0"
description = "Match Yoto MYO playlist tracks to display icons, with an LLM in the loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
yoto-iconer = "yoto_iconer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yoto_iconer"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
